[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-chat"
version = "1.0.0"
description = "A terminal chat client for the Google Gemini API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hector Miranda" }]
keywords = ["gemini", "llm", "chat", "cli", "terminal"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
# No third-party runtime dependencies — the client speaks HTTP over the stdlib.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[project.scripts]
gemini = "gemini_chat.cli:main"

[project.urls]
Homepage = "https://github.com/hectorMiranda/gemini"

[tool.setuptools.packages.find]
include = ["gemini_chat*"]

[tool.setuptools.package-data]
gemini_chat = ["py.typed"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
